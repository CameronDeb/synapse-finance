{% extends "base.html" %}

{% block title %}Login - Synapse Finance{% endblock %}

{% block head_styles %}
<style>
    body {
         display: flex;
         justify-content: center;
         align-items: center;
         min-height: 100vh;
    }
    label { color: #aaa; }
    input[type="email"], input[type="password"] {
        background-color: #333;
        border: 1px solid #555;
        color: #e0e0e0;
    }
    input[type="email"]:focus, input[type="password"]:focus {
        border-color: #00bfa5;
        outline: none;
        box-shadow: 0 0 0 2px rgba(0, 191, 165, 0.3);
    }
    .form-link { color: #00bfa5; }
    .form-link:hover { text-decoration: underline; }
    .submit-button { background-color: #00bfa5; color: #121212; }
    .submit-button:hover { background-color: #008c7a; }
</style>
{% endblock %}

{% block content %}
<div class="w-full max-w-md p-8 space-y-6 bg-[#1e1e1e] rounded-lg shadow-md border border-[#333]">
    <h2 class="text-2xl font-bold text-center text-white">Log in to your account</h2>

    <form class="space-y-6" action="{{ url_for('login_page') }}" method="POST">
        <div>
            <label for="email" class="block text-sm font-medium">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required
                   class="mt-1 block w-full px-3 py-2 rounded-md shadow-sm focus:ring-[#00bfa5] focus:border-[#00bfa5] sm:text-sm">
        </div>

        <div>
            <div class="flex items-center justify-between">
                <label for="password" class="block text-sm font-medium">Password</label>
                <!-- NEW: Forgot Password Link -->
                <div class="text-sm">
                    <a href="{{ url_for('request_reset') }}" class="font-medium form-link">Forgot your password?</a>
                </div>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   class="mt-1 block w-full px-3 py-2 rounded-md shadow-sm focus:ring-[#00bfa5] focus:border-[#00bfa5] sm:text-sm">
        </div>

        <div>
            <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium submit-button transition duration-150 ease-in-out">
                Sign in
            </button>
        </div>
    </form>

    {% if demo_mode %}
    <form action="{{ url_for('start_demo') }}" method="POST" class="pt-2 border-t border-[#333]">
        <button type="submit" class="w-full py-2 px-4 rounded-md text-sm font-medium text-[#00bfa5] border border-[#00bfa5] hover:bg-[#00bfa5]/10 transition">
            Just looking? Try the demo account
        </button>
    </form>
    {% endif %}

    <p class="mt-4 text-center text-sm text-gray-400">
        Don't have an account?
        <a href="{{ url_for('signup_page') }}" class="font-medium form-link">Sign up here</a>
    </p>
</div>
{% endblock %}
